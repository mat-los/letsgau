# Let's Gau instance configuration (Schongau).
# Every option is documented in docs/CONFIGURATION.md.
# The file is validated on startup; typos abort with file, line and field.

site:
  name: "Let's Gau"                     # site name shown in the header
  base_url: "https://letsgau.de"        # public URL; domain not registered yet
  languages: [de, en]                   # first entry = default language
  owner: "mat-los"                      # must match the GitHub repo owner, else build aborts
  # contact_email: ""                   # optional: shown on the pages if set; here only the form
  feedback_form_endpoint: "https://formhook.app/f/fh_JNXIIbcjfUatEDM3yXzTWygLzvbkKTeo"  # contact form (formhook; public, in the page)
  timezone: "Europe/Berlin"             # IANA time zone; decides what "today" is
  indexing: false                       # false = noindex on every page (not in search results yet)

region:
  label: "Schongau"                     # name of the center, used in the coverage sentence
  center: { lat: 47.811, lon: 10.896 }  # approx. Schongau old town
  drive_time_minutes: 5                 # TESTING value (target: 30); change triggers geo + discovery
  place_types: [city, town, village]    # OSM place types, hamlets ignored
  include_places: []                    # e.g. ["Landsberg am Lech", "Weilheim in Oberbayern"]
  exclude_places: []                    # places deliberately left out

window:
  display_days: 21                      # how far ahead the website shows
  crawl_days: 28                        # how far ahead we search (1 week buffer)
  store_days: 180                       # events seen up to this far ahead are kept (no search)
  deep_check_days: 7                    # period that gets thorough re-checks

jobs:                                   # format: off | daily | weekly:mon,thu | monthly:1
  discovery: "monthly:1"                # find and rate new sources
  events: "weekly:mon,thu"              # crawl events
  build: "daily"                        # rebuild daily so "today" is correct

models:                                 # Claude model IDs per step
  discovery: "claude-sonnet-5-5"
  events: "claude-sonnet-5-5"
  merge: "claude-haiku-5-5"

ai:
  auth: "subscription"                  # subscription (Claude Code + plan) | api_key (Claude API)

limits:
  max_web_searches_per_run: 250         # cost brake per run and stage
  places_per_request: 6                 # places per Claude request
  max_runtime_minutes: 60               # no new AI call starts after this (per stage)

depth:                                  # thoroughness: more AI calls, more complete results
  discovery_focus_passes: true          # 3 calls per batch: official, clubs, venues
  discovery_places_per_request: 2       # municipalities per discovery call
  discovery_searches_per_request: 20    # search limit per discovery call
  crawl_sources_per_request: 4          # known sources per "source sweep" call; 0 = one combined call
  crawl_searches_per_request: 13        # open-search budget per batch (calls of ~13 searches; each run starts the checklist elsewhere)

events:
  unconfirmed_after_misses: 2           # runs without a hit before "unconfirmed"
  description_max_chars: 200            # max length of an event description

sources:
  whitelist_file: "instance/sources/whitelist.yaml"   # always checked on every event run
  blacklist_file: "instance/sources/blacklist.yaml"   # never used as a source
  flyers_file: "instance/sources/flyers.yaml"         # pages read as images/PDFs (posters, flyers)
  instagram_file: "instance/sources/instagram.yaml"   # Instagram accounts (needs the INSTAGRAM_* secrets)
  instagram_candidates_file: "instance/sources/instagram_candidates.yaml"  # unconfirmed accounts, checked by profile

instagram:                              # reading Instagram business/creator accounts
  posts_per_account: 6                  # latest posts fetched per account and run
  max_post_age_days: 21                 # older posts are not read
  max_accounts_per_run: 40              # the list first, then accounts found on pages
  read_mined: true                      # also read accounts linked from pages the crawl reads
  api_version: ""                       # Graph API version such as "v24.0"; empty = app default
  ai_lookup: false                      # discovery's AI lookup call; off: its search rarely shows usernames

excluded_topics:                        # topic blacklist: never include such events
  - "First-aid courses and similar mandatory courses"
  - "Events in strip clubs, swinger clubs and erotic events"
  - "Events by far-right parties and groups"

tags:                                   # fixed list, the AI must not invent new ones
  - { id: concert,         de: "Konzert",            en: "Concert" }
  - { id: party,           de: "Party",              en: "Party" }
  - { id: sports,          de: "Sport",              en: "Sports" }
  - { id: art-culture,     de: "Kunst & Kultur",     en: "Art & Culture" }
  - { id: theatre-cinema,  de: "Theater & Kino",     en: "Theatre & Cinema" }
  - { id: outdoor,         de: "Outdoor",            en: "Outdoor" }
  - { id: family-kids,     de: "Familie & Kinder",   en: "Family & Kids" }
  - { id: market-festival, de: "Markt & Fest",       en: "Market & Festival" }
  - { id: food-drink,      de: "Kulinarik",          en: "Food & Drink" }
  - { id: talk-workshop,   de: "Vortrag & Workshop", en: "Talk & Workshop" }
  - { id: religion,        de: "Religion",           en: "Religion" }
