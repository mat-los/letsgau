# Live check of discovery and the event crawl with the real AI (subscription
# mode). Manual only (Actions -> Crawl check -> Run workflow): a run uses about
# as much of the plan as a real pipeline run, and its results are thrown away,
# so it is meant for trying a bigger prompt change before merging (CLAUDE.md).
# Computes the places for the instance config, runs discovery into the runner's
# throwaway data/ directory (so the crawl sees its sources), then
# `letsgau run --job events --dry-run --limit-places N`. Writes nothing to the
# repository; prints sources, coverage and events and uploads the raw AI answers
# as an artifact for test fixtures. Needs the CLAUDE_CODE_OAUTH_TOKEN secret; ANTHROPIC_API_KEY must not be set, or Claude
# Code would bill it.
name: Crawl check
run-name: "Crawl check: ${{ inputs.limit_places }} place(s), dry run"

on:
  workflow_dispatch:
    inputs:
      limit_places:
        description: "Number of places to crawl (nearest first)"
        default: "3"

permissions:
  contents: read

concurrency:
  group: crawl-check
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}   # optional: Instagram accounts
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      LIMIT_PLACES: ${{ inputs.limit_places || '3' }}
      LETSGAU_RECORD_DIR: ${{ github.workspace }}/recordings
      DISABLE_AUTOUPDATER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -e '.[dev]'
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Require secrets
        run: |
          missing=0
          for name in CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing (Settings -> Secrets and variables -> Actions)"
              missing=1
            fi
          done
          exit $missing
      - name: Geo (places for the instance config)
        timeout-minutes: 6
        run: python -m letsgau run --job geo
      - name: Discovery (${{ env.LIMIT_PLACES }} places, throwaway data/)
        timeout-minutes: 35
        run: |
          set -o pipefail
          python -m letsgau run --job discovery --limit-places "$LIMIT_PLACES" | tee discovery.txt
          {
            echo "### Discovery check ($LIMIT_PLACES places)"
            echo '```text'
            cat discovery.txt
            echo '```'
            echo
            cat data/suggested.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Event crawl (dry run, ${{ env.LIMIT_PLACES }} places)
        timeout-minutes: 40
        run: |
          set -o pipefail
          python -m letsgau run --job events --dry-run --limit-places "$LIMIT_PLACES" | tee crawl.txt
          {
            echo "### Crawl check ($LIMIT_PLACES places)"
            echo '```text'
            cat crawl.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check whitelist URLs (informational)
        # runs after a failed step too, but not after a cancel (always() kept it running)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -m letsgau sources --check | tee sources.txt
          {
            echo "### Whitelist URLs"
            echo '```text'
            cat sources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Print raw AI answers
        if: always()
        run: |
          for f in recordings/*.json; do
            [ -e "$f" ] || continue
            echo "=== $f"
            python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1])), ensure_ascii=False, separators=(',', ':')))" "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-recordings
          path: recordings/
          if-no-files-found: ignore
