# Live check of the geo stage against Overpass (OpenStreetMap): the places of the
# municipalities in instance/config.yaml. Runs on demand (Actions -> Geo check -> Run
# workflow) and on pull requests that change this file. Writes nothing to data/.
name: Geo check
run-name: >-
  ${{ github.event_name == 'pull_request' && 'Geo check: workflow change' || 'Geo check' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/geo-check.yml"

permissions:
  contents: read

concurrency:
  group: geo-check
  cancel-in-progress: false

jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Geo stage with instance config (dry run)
        timeout-minutes: 10
        run: |
          set -o pipefail
          python -m letsgau run --job geo --dry-run --force | tee places.txt
          {
            echo "### Municipalities and places"
            echo '```text'
            cat places.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
