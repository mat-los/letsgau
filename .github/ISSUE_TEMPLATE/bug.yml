name: Bug report
description: Something is wrong on the website or in the pipeline (e.g. wrong event data).
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Include the URL of the day page or the event if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: source
    attributes:
      label: Source with the correct information (optional)
      placeholder: https://...
